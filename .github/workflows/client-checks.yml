# Lints and builds the React app (client/) on GitHub for every push and pull
# request that touches it. Shows a ✓ / ✗ next to the commit on GitHub.
name: Client checks

on:
  push:
    paths: ['client/**', '.github/workflows/client-checks.yml']
  pull_request:
    paths: ['client/**', '.github/workflows/client-checks.yml']

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npx eslint .
      - run: npm run build
