# Local PostgreSQL for the bank API.
#   docker compose up -d     start (data persists in the bank-db volume)
#   docker compose down      stop
#   docker compose down -v   stop AND delete all data
# Values come from server/.env (Compose reads it automatically).
services:
  db:
    image: postgres:17-alpine
    container_name: portfolio-bank-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 5433 on your Mac (localhost only) → 5432 in the container
      # (5432 is already used by the Postgres installed on the Mac)
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bank-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bank-db:
