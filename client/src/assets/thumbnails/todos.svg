<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efedf4"/>
      <stop offset="1" stop-color="#e5e1ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#2a2340" flood-opacity="0.12"/>
    </filter>
    <g id="trash" stroke="#e5484d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6 h18"/>
      <path d="M8 6 V4 h8 V6"/>
      <path d="M6 6 l1.2 15 a1 1 0 0 0 1 1 h7.6 a1 1 0 0 0 1 -1 L18 6"/>
      <path d="M10 11 v6 M14 11 v6"/>
    </g>
  </defs>

  <rect width="1200" height="1050" fill="url(#bg)"/>

  <!-- list pane -->
  <rect x="140" y="120" width="920" height="810" rx="24" fill="#ffffff" stroke="#e5e4e7" stroke-width="2" filter="url(#shadow)"/>

  <text x="184" y="208" fill="#08060d" font-size="42" font-weight="700" letter-spacing="-0.5">Recent Todos</text>

  <!-- row 1 (completed) -->
  <g>
    <rect x="180" y="250" width="840" height="84" rx="12" fill="#ffffff" stroke="#e5e4e7" stroke-width="2"/>
    <circle cx="206" cy="282" r="2.6" fill="#c3bfcc"/><circle cx="218" cy="282" r="2.6" fill="#c3bfcc"/>
    <circle cx="206" cy="292" r="2.6" fill="#c3bfcc"/><circle cx="218" cy="292" r="2.6" fill="#c3bfcc"/>
    <circle cx="206" cy="302" r="2.6" fill="#c3bfcc"/><circle cx="218" cy="302" r="2.6" fill="#c3bfcc"/>
    <rect x="248" y="276" width="32" height="32" rx="8" fill="#aa3bff"/>
    <polyline points="256,292 263,299 274,285" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="304" y="301" fill="#9a94a3" font-size="26" text-decoration="line-through">Book roof inspection</text>
    <use href="#trash" transform="translate(966,280)"/>
  </g>

  <!-- row 2 -->
  <g>
    <rect x="180" y="352" width="840" height="84" rx="12" fill="#ffffff" stroke="#e5e4e7" stroke-width="2"/>
    <circle cx="206" cy="384" r="2.6" fill="#c3bfcc"/><circle cx="218" cy="384" r="2.6" fill="#c3bfcc"/>
    <circle cx="206" cy="394" r="2.6" fill="#c3bfcc"/><circle cx="218" cy="394" r="2.6" fill="#c3bfcc"/>
    <circle cx="206" cy="404" r="2.6" fill="#c3bfcc"/><circle cx="218" cy="404" r="2.6" fill="#c3bfcc"/>
    <rect x="248" y="378" width="32" height="32" rx="8" fill="#ffffff" stroke="#d9d6de" stroke-width="2"/>
    <text x="304" y="403" fill="#08060d" font-size="26">Call shingle supplier</text>
    <use href="#trash" transform="translate(966,382)"/>
  </g>

  <!-- row 3 -->
  <g>
    <rect x="180" y="454" width="840" height="84" rx="12" fill="#ffffff" stroke="#e5e4e7" stroke-width="2"/>
    <circle cx="206" cy="486" r="2.6" fill="#c3bfcc"/><circle cx="218" cy="486" r="2.6" fill="#c3bfcc"/>
    <circle cx="206" cy="496" r="2.6" fill="#c3bfcc"/><circle cx="218" cy="496" r="2.6" fill="#c3bfcc"/>
    <circle cx="206" cy="506" r="2.6" fill="#c3bfcc"/><circle cx="218" cy="506" r="2.6" fill="#c3bfcc"/>
    <rect x="248" y="480" width="32" height="32" rx="8" fill="#ffffff" stroke="#d9d6de" stroke-width="2"/>
    <text x="304" y="505" fill="#08060d" font-size="26">Send client the quote</text>
    <use href="#trash" transform="translate(966,484)"/>
  </g>

  <!-- row 4 -->
  <g>
    <rect x="180" y="556" width="840" height="84" rx="12" fill="#ffffff" stroke="#e5e4e7" stroke-width="2"/>
    <circle cx="206" cy="588" r="2.6" fill="#c3bfcc"/><circle cx="218" cy="588" r="2.6" fill="#c3bfcc"/>
    <circle cx="206" cy="598" r="2.6" fill="#c3bfcc"/><circle cx="218" cy="598" r="2.6" fill="#c3bfcc"/>
    <circle cx="206" cy="608" r="2.6" fill="#c3bfcc"/><circle cx="218" cy="608" r="2.6" fill="#c3bfcc"/>
    <rect x="248" y="582" width="32" height="32" rx="8" fill="#ffffff" stroke="#d9d6de" stroke-width="2"/>
    <text x="304" y="607" fill="#08060d" font-size="26">Schedule crew for Monday</text>
    <use href="#trash" transform="translate(966,586)"/>
  </g>

  <!-- row 5 -->
  <g>
    <rect x="180" y="658" width="840" height="84" rx="12" fill="#ffffff" stroke="#e5e4e7" stroke-width="2"/>
    <circle cx="206" cy="690" r="2.6" fill="#c3bfcc"/><circle cx="218" cy="690" r="2.6" fill="#c3bfcc"/>
    <circle cx="206" cy="700" r="2.6" fill="#c3bfcc"/><circle cx="218" cy="700" r="2.6" fill="#c3bfcc"/>
    <circle cx="206" cy="710" r="2.6" fill="#c3bfcc"/><circle cx="218" cy="710" r="2.6" fill="#c3bfcc"/>
    <rect x="248" y="684" width="32" height="32" rx="8" fill="#ffffff" stroke="#d9d6de" stroke-width="2"/>
    <text x="304" y="709" fill="#08060d" font-size="26">Order gutter materials</text>
    <use href="#trash" transform="translate(966,688)"/>
  </g>

  <!-- add button -->
  <rect x="180" y="800" width="214" height="56" rx="12" fill="#aa3bff" fill-opacity="0.12"/>
  <text x="214" y="836" fill="#aa3bff" font-size="26" font-weight="600">+  New todo</text>
</svg>
