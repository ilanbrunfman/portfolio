<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#e2e9f6"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1f2a44" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- header -->
  <text x="48" y="54" fill="#0f172a" font-size="28" font-weight="800" letter-spacing="-0.5">Summit Roofing</text>
  <text x="712" y="52" fill="#64748b" font-size="18">Services</text>
  <text x="812" y="52" fill="#64748b" font-size="18">Why us</text>
  <text x="904" y="52" fill="#64748b" font-size="18">Reviews</text>
  <rect x="1010" y="24" width="142" height="46" rx="9" fill="#2563eb"/>
  <text x="1081" y="53" fill="#ffffff" font-size="18" font-weight="600" text-anchor="middle">Free quote</text>

  <!-- eyebrow -->
  <rect x="438" y="292" width="20" height="2" fill="#2563eb"/>
  <text x="472" y="299" fill="#2563eb" font-size="16" font-weight="700" letter-spacing="2">LICENSED &amp; INSURED · 24/7 SERVICE</text>

  <!-- headline -->
  <text x="600" y="390" fill="#0f172a" font-size="66" font-weight="800" text-anchor="middle" letter-spacing="-1">Roofing done right,</text>
  <text x="600" y="462" fill="#0f172a" font-size="66" font-weight="800" text-anchor="middle" letter-spacing="-1">the first time.</text>

  <!-- subtitle -->
  <text x="600" y="516" fill="#5b6472" font-size="22" text-anchor="middle">Repairs, replacements &amp; storm damage — honest pricing.</text>

  <!-- buttons -->
  <rect x="390" y="560" width="222" height="54" rx="10" fill="#2563eb"/>
  <text x="501" y="594" fill="#ffffff" font-size="20" font-weight="600" text-anchor="middle">Get a free quote</text>
  <rect x="632" y="560" width="178" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="721" y="594" fill="#0f172a" font-size="20" text-anchor="middle">View services</text>

  <!-- peeking service cards (light) -->
  <g filter="url(#cardShadow)">
    <!-- card 1 -->
    <rect x="60" y="712" width="340" height="180" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="84" y="736" width="48" height="48" rx="12" fill="#2563eb" fill-opacity="0.12"/>
    <rect x="84" y="804" width="150" height="14" rx="7" fill="#334155"/>
    <rect x="84" y="834" width="280" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="84" y="854" width="220" height="10" rx="5" fill="#cbd5e1"/>
    <!-- card 2 -->
    <rect x="430" y="712" width="340" height="180" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="454" y="736" width="48" height="48" rx="12" fill="#2563eb" fill-opacity="0.12"/>
    <rect x="454" y="804" width="150" height="14" rx="7" fill="#334155"/>
    <rect x="454" y="834" width="280" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="454" y="854" width="220" height="10" rx="5" fill="#cbd5e1"/>
    <!-- card 3 -->
    <rect x="800" y="712" width="340" height="180" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="824" y="736" width="48" height="48" rx="12" fill="#2563eb" fill-opacity="0.12"/>
    <rect x="824" y="804" width="150" height="14" rx="7" fill="#334155"/>
    <rect x="824" y="834" width="280" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="824" y="854" width="220" height="10" rx="5" fill="#cbd5e1"/>
  </g>
</svg>
