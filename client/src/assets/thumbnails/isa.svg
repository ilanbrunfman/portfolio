<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f8"/>
      <stop offset="1" stop-color="#e2e8f2"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2f6b"/>
      <stop offset="1" stop-color="#071d49"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- navy top bar -->
  <rect x="0" y="0" width="1200" height="92" fill="#071d49"/>
  <text x="48" y="58" fill="#ffffff" font-size="30" font-weight="800" letter-spacing="-0.5">Lumvera</text>
  <text x="792" y="56" fill="#ffffff" opacity="0.85" font-size="19">ISI</text>
  <text x="856" y="56" fill="#ffffff" opacity="0.85" font-size="19">References</text>
  <rect x="1020" y="26" width="132" height="42" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.45"/>
  <text x="1086" y="53" fill="#ffffff" font-size="19" text-anchor="middle">Slides</text>

  <!-- cover slide card -->
  <rect x="48" y="122" width="1104" height="620" rx="24" fill="url(#cover)"/>

  <!-- left: stacked icon + eyebrow + title + tagline -->
  <rect x="116" y="196" width="48" height="34" rx="8" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  <rect x="104" y="212" width="48" height="34" rx="8" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="104" y="300" fill="#ffffff" opacity="0.75" font-size="16" font-weight="700" letter-spacing="2">INTERACTIVE SALES AID · DEMO</text>
  <text x="100" y="392" fill="#ffffff" font-size="88" font-weight="800" letter-spacing="-2">Lumvera</text>
  <text x="104" y="446" fill="#ffffff" opacity="0.82" font-size="24">Sustained skin clearance with convenient dosing.</text>
  <rect x="104" y="488" width="320" height="44" rx="22" fill="#ffffff" fill-opacity="0.15"/>
  <text x="128" y="516" fill="#ffffff" font-size="18">Swipe or use the arrows to explore →</text>

  <!-- right: molecule -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="2">
    <line x1="910" y1="430" x2="910" y2="320"/>
    <line x1="910" y1="430" x2="820" y2="370"/>
    <line x1="910" y1="430" x2="1000" y2="370"/>
    <line x1="910" y1="430" x2="828" y2="520"/>
    <line x1="910" y1="430" x2="1000" y2="510"/>
    <line x1="910" y1="430" x2="910" y2="560"/>
  </g>
  <circle cx="910" cy="430" r="46" stroke="#5b9bf5" stroke-opacity="0.5" stroke-width="2" fill="none"/>
  <circle cx="910" cy="430" r="24" fill="#5b9bf5"/>
  <circle cx="910" cy="320" r="15" fill="#ffffff"/>
  <circle cx="820" cy="370" r="12" fill="#5b9bf5"/>
  <circle cx="1000" cy="370" r="16" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="828" cy="520" r="16" fill="#5b9bf5"/>
  <circle cx="1000" cy="510" r="12" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="910" cy="560" r="14" fill="#ffffff" fill-opacity="0.9"/>

  <!-- bottom nav -->
  <rect x="104" y="792" width="118" height="46" rx="10" fill="#0b5cd7"/>
  <text x="163" y="822" fill="#ffffff" font-size="19" font-weight="600" text-anchor="middle">Cover</text>
  <text x="285" y="822" fill="#64748b" font-size="19" font-weight="600">MOA</text>
  <text x="380" y="822" fill="#64748b" font-size="19" font-weight="600">Efficacy</text>
  <text x="520" y="822" fill="#64748b" font-size="19" font-weight="600">Dosing</text>
  <text x="648" y="822" fill="#64748b" font-size="19" font-weight="600">Safety</text>
  <text x="762" y="822" fill="#64748b" font-size="19" font-weight="600">Summary</text>
</svg>
